# AppChama — copie para C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Domínio: agilizeerp.com.br (Apache na porta 80, sem conflito com MySQL 3307 / Redis 6379 / Evolution 8080)

<VirtualHost *:80>
    ServerName agilizeerp.com.br
    ServerAlias www.agilizeerp.com.br
    DocumentRoot "C:/xampp/htdocs/appchama/api/public"
    <Directory "C:/xampp/htdocs/appchama/api/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/appchama-error.log"
    CustomLog "logs/appchama-access.log" common
</VirtualHost>
