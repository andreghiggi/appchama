# AppChama — copie para C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Admin: appchama.agilizeerp.com.br | API: apichama.agilizeerp.com.br

<VirtualHost *:80>
    ServerName appchama.agilizeerp.com.br
    DocumentRoot "C:/xampp/htdocs/appchama/api/public"
    <Directory "C:/xampp/htdocs/appchama/api/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/appchama-admin-error.log"
    CustomLog "logs/appchama-admin-access.log" common
</VirtualHost>

<VirtualHost *:80>
    ServerName apichama.agilizeerp.com.br
    DocumentRoot "C:/xampp/htdocs/appchama/api/public"
    <Directory "C:/xampp/htdocs/appchama/api/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/appchama-api-error.log"
    CustomLog "logs/appchama-api-access.log" common
</VirtualHost>
