services:
  mysql:
    image: mysql:8.0
    container_name: appchama_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appchama}
      MYSQL_USER: ${MYSQL_USER:-appchama}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appchama

  redis:
    image: redis:7-alpine
    container_name: appchama_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - appchama

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: appchama_app
    restart: unless-stopped
    working_dir: /var/www/api
    volumes:
      - ../api:/var/www/api
    depends_on:
      - mysql
      - redis
    networks:
      - appchama
    env_file:
      - .env

  horizon:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: appchama_horizon
    restart: unless-stopped
    working_dir: /var/www/api
    command: php artisan horizon
    volumes:
      - ../api:/var/www/api
    depends_on:
      - mysql
      - redis
      - app
    networks:
      - appchama
    env_file:
      - .env

  reverb:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: appchama_reverb
    restart: unless-stopped
    working_dir: /var/www/api
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ../api:/var/www/api
    depends_on:
      - redis
      - app
    networks:
      - appchama
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: appchama_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ../api:/var/www/api
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - appchama

volumes:
  mysql_data:
  redis_data:

networks:
  appchama:
    driver: bridge
